<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Librería — Programación III</title>
  <meta name="description" content="Trabajo práctico integrador de frontend para una librería, desarrollado con HTML, CSS y JavaScript nativos.">
</head>
<body>
  <header>
    <h1>Librería</h1>
    <nav aria-label="Navegación principal">
      <ul>
        <li><a href="#catalogo" aria-current="page">Catálogo</a></li>
        <li><a href="#libros">Libros</a></li>
        <li><a href="#clientes">Clientes</a></li>
        <li><a href="#ventas">Ventas</a></li>
        <li><a href="#historial">Historial</a></li>
      </ul>
    </nav>
  </header>

  <main id="contenido">
    <section id="catalogo" aria-labelledby="catalogo-titulo">
      <h2 id="catalogo-titulo">Catálogo</h2>
      <p>No hay libros para mostrar.</p>
    </section>

    <section id="libros" aria-labelledby="libros-titulo">
      <h2 id="libros-titulo">Libros</h2>
      <p>No hay libros registrados.</p>
    </section>

    <section id="clientes" aria-labelledby="clientes-titulo">
      <h2 id="clientes-titulo">Clientes</h2>
      <p>No hay clientes registrados.</p>
    </section>

    <section id="ventas" aria-labelledby="ventas-titulo">
      <h2 id="ventas-titulo">Ventas</h2>
      <p>Todavía no se agregaron renglones a la venta.</p>
    </section>

    <section id="historial" aria-labelledby="historial-titulo">
      <h2 id="historial-titulo">Historial</h2>
      <p>No hay ventas registradas.</p>
    </section>
  </main>
</body>
</html>
